# Host-side checks only.
#
# Every suite here is deliberately buildable without a CUDA toolkit and without
# a GPU, so it runs on a stock runner. The CUDA build itself is NOT attempted:
# it needs nvcc and, to be worth anything, a GPU to run against. Those stay a
# manual step before a release.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Host-side tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed buffer capacity follows the seed pattern
        run: bash tests/test_seed_capacity.bash

      - name: LASTZ scoring file is read in full
        run: bash tests/test_scoring.bash

      # The bug this guards is interpreter-dependent: statistics.quantiles()
      # raises on one data point up to 3.12 and returns it from 3.13. Pin 3.12,
      # which is what the conda-forge kegalign recipe ships, or the named case
      # silently stops being covered when the runner image advances.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: runner.py chunk-size estimation
        run: python tests/test_chunk_size.py

      - name: MAF output order is deterministic
        run: python tests/test_output_order.py
      - name: ruff
        run: |
          pipx run ruff check scripts tests
          pipx run ruff format --check scripts tests

      - name: mypy --strict
        run: |
          pipx run mypy --config-file scripts/mypy.ini scripts/*.py
          pipx run mypy --config-file scripts/mps-mig/mypy.ini scripts/mps-mig/*.py

      - name: CUDA architecture selection
        run: cmake -P tests/test_cuda_architectures.cmake

  version:
    name: VERSION matches the tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: common/parameters.h agrees with the tag being released
        run: bash tests/check_version.bash "${GITHUB_REF_NAME}"
